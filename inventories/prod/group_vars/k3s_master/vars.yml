---
# K3s master configuration
k3s_role: "server"
# servicelb (klipper) MUST stay disabled: MetalLB owns LoadBalancer services.
# With both active, klipper claims every LB service first and writes node IPs
# into .status, which is what external-dns then publishes.
k3s_extra_flags: "--disable traefik --disable servicelb --write-kubeconfig-mode 644"
k3s_advertise_routes: "192.168.1.0/24"

# Ports this node needs open. Named for the role that consumes them rather than
# aliased through a second k3s_master_* set - one name, one place.
firewall_tcp_ports:
  - 6443     # kube-apiserver
  - 10250    # kubelet
  - 10251    # kube-scheduler
  - 10252    # kube-controller-manager
  - 53       # CoreDNS
firewall_udp_ports:
  - 8472     # flannel VXLAN
  - 53       # CoreDNS

# Address published into every Ingress .status by the nginx controller, and
# therefore the address external-dns writes to Cloudflare.
#
# This was the Tailscale IP (100.117.255.24) between 2026-08-19 and 2026-08-23,
# on the reasoning that one address resolves the same on and off the LAN. The
# cost was not obvious: 100.64.0.0/10 is CGNAT and routable only from inside the
# tailnet, so the public record became useless to any LAN device that does not
# ask Pi-hole for it. Pi-hole's split-horizon override hid that from every
# machine that does. Chromecasts ignore DHCP-supplied DNS and query 8.8.8.8
# directly, so they got the CGNAT address and could not open a connection at
# all - TiviMate failed with no server-side log line, because nothing arrived.
#
# The LAN VIP serves both audiences instead: LAN clients reach it directly, and
# tailnet clients reach it over the 192.168.1.0/24 subnet route this node
# already advertises (k3s_advertise_routes, live as a PrimaryRoute). A tailnet
# client physically on this LAN ignores that route in favour of its own
# interface route, which lands on the same address anyway.
ingress_status_address: "{{ ingress_lan_address }}"

# Still pinned onto the controller Service as an externalIP, so kube-proxy keeps
# accepting traffic addressed to the Tailscale IP directly. MetalLB announces
# only the LAN VIP by ARP, so without this a tailnet client hitting the node's
# Tailscale address by IP would reach a closed port. Not published to DNS.
ingress_tailscale_address: "100.117.255.24"

# The ingress-nginx MetalLB VIP, pinned so the Pi-hole split-horizon overrides
# point at a stable address. Must sit inside the MetalLB pool in
# k8s/infrastructure/metallb/ippool.yml.
ingress_lan_address: "192.168.1.3"

# Ad-blocking away from home does NOT depend on this. It used to, on the
# premise recorded here that "Tailscale's custom global nameserver is gated on
# the free plan" - that premise was wrong. Custom global nameservers are
# available on the Personal plan, and believing otherwise cost the tailnet its
# ad filtering entirely: the DNS page was left empty, so a device away from home
# received no resolver from the coordination server and quietly kept using the
# café or carrier one. Pi-hole's query log ran seven days without a single
# 100.64.0.0/10 client.
#
# The DNS page now publishes ds10u as a global nameserver with Override local
# DNS on, which is what filters ads off the LAN. The exit node stays advertised
# because it is still worth having, but it is no longer load-bearing for DNS.
#
# That global nameserver is the node's Tailscale address, not 192.168.1.2:
# the LAN VIP is only reachable through the 192.168.1.0/24 subnet route, and a
# Linux peer physically on this LAN cannot safely accept that route (see
# roles/tailscale/meta/argument_specs.yml). The externalIPs entry on the Pi-hole
# Service in k8s/apps/pihole/pihole.yml is what makes :53 answer there.
tailscale_advertise_exit_node: true

# ds10u must not take DNS from the tailnet: it is the node the tailnet's own
# nameserver resolves to. Left at Tailscale's default of true, "Override local
# DNS" points this host at 100.100.100.100 -> Pi-hole -> a pod on this same
# host, and drops resolver_fallback in the process. That is the deadlock
# described under resolver_primary below, reintroduced from the admin console
# rather than from this repo.
tailscale_accept_dns: false

# Pi-hole primary, for this host's own lookups.
#
# The fallback must be a resolver that actually answers. 192.168.1.254 was tried
# first and does not run DNS at all - it only relays DHCP - so the fallback was
# dead weight. That turned a Pi-hole restart into a deadlock: Pi-hole is a pod on
# this host, so while it is down the node cannot resolve the registry to pull the
# very image it needs to come back. A public resolver breaks that loop. It is
# only consulted when Pi-hole fails to answer, so ad filtering is unaffected in
# normal operation.
resolver_primary: "192.168.1.2"
resolver_fallback: "1.1.1.1"

resolver_exclusive: true

# The router advertises its own nameserver over IPv6 RDNSS, which resolver_
# exclusive does not suppress - it only covers the DHCPv4 option. Without this,
# resolv.conf here carried a third, unfiltered nameserver (fd36:7e6:76f0::1)
# that nothing in this repo put there. ds10u has no IPv6 default route, so
# refusing RAs costs it only a ULA address that routes nowhere.
resolver_deny_ra_dns: true
