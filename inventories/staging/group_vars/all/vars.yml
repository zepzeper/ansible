---
# Staging stands in for the vault so CI needs no secret to converge. These names
# must track roles' vault_* references; the tags CI check fails if a role gains a
# new one that is not defined here.
vault_k3s_token: "staging-not-a-real-token"
vault_tailscale_authkey: "tskey-staging-not-real"
vault_cloudflare_api_token: "staging-not-a-real-token"
vault_homepage_homeassistant_token: "staging"
vault_homepage_mealie_token: "staging"
vault_homepage_prowlarr_token: "staging"
vault_homepage_qbittorrent_password: "staging"
vault_homepage_qbittorrent_username: "staging"
vault_homepage_readarr_token: "staging"
vault_homepage_uptime_kuma_token: "staging"
vault_tuliprox_password: "staging"
vault_tuliprox_remote_url: "https://example.invalid/staging"
vault_tuliprox_username: "staging"

server_hostname: "ds10u-staging"
admin_username: "zepzeper"
admin_group: "zepzeper"

# Exercise the resolver's manager-detection branch. The container has neither
# systemd-resolved nor dhcpcd, so this must land on the warning path rather than
# writing a file nothing reads - the exact bug that shipped to prod once.
resolver_primary: "192.0.2.53"
resolver_fallback: "192.0.2.54"

# A container shares the host kernel: no swap of its own to disable, and
# br_netfilter is loaded on the host or not at all.
manage_hostname: false
manage_swap: false
manage_kernel_modules: false
