---
# Throwaway container that exists to be broken. It runs the same roles as prod
# through the same code path, so a change is proven to converge - and to be
# idempotent - before it is ever pointed at ds10u.
#
# Brought up by `make staging-up`, which starts a systemd-enabled Debian
# container. Ansible talks to it over the docker connection plugin rather than
# SSH, so there is no key material or sshd to manage.
all:
  children:
    k3s:
      children:
        k3s_master:
          hosts:
            staging:
              ansible_connection: community.docker.docker
              ansible_host: ds10u-staging
              ansible_user: root
              ansible_python_interpreter: /usr/bin/python3
