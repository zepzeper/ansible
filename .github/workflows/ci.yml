---
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        env:
          ANSIBLE_VAULT_PASSWORD: dummy
        run: ansible-lint

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax check all playbooks
        env:
          ANSIBLE_VAULT_PASSWORD: dummy
          ANSIBLE_PLAYBOOK: ansible-playbook
        run: make syntax-check

  converge:
    name: Converge + idempotence (staging container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      # No vault password: the staging inventory carries its own non-secret
      # stand-ins, so this job needs nothing privileged to run.
      - name: Converge, then prove idempotence
        env:
          ANSIBLE_PLAYBOOK: ansible-playbook
          ANSIBLE_FORCE_COLOR: "1"
        run: make idempotence

      - name: Tear down
        if: always()
        run: make staging-down

  tags:
    name: Every Makefile target selects at least one task
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      # `make base` and `make apps` once filtered on tags that existed nowhere.
      # Both ran zero tasks and exited 0, which is indistinguishable from success.
      - name: Assert no tag selects an empty task list
        env:
          ANSIBLE_VAULT_PASSWORD: dummy
        run: ./scripts/check-tags.sh

      # prod's group_vars carried its own base_packages, and that copy had lost
      # openssh-server. group_vars outranks role defaults, so the role's correct
      # list was masked and nothing failed loudly.
      - name: Assert no inventory value restates or truncates a role default
        env:
          PY: python
        run: ./scripts/check-var-drift.sh

  wiki-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync docs to GitHub Wiki
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          WIKI_DIR="${RUNNER_TEMP}/wiki"
          git clone "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$WIKI_DIR"
          rm -rf "${WIKI_DIR:?}"/*
          cp -r docs/* "$WIKI_DIR/"
          cd "$WIKI_DIR"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "Sync docs from main repo [skip ci]"
            git push
          fi
