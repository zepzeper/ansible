---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-library
  namespace: books
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  namespace: books
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre
  template:
    metadata:
      labels:
        app: calibre
    spec:
      containers:
        - name: calibre
          # Pinned to the digest running on 2026-08-20. The tag is kept for
          # readability; the digest is what actually resolves, so a reschedule
          # cannot silently change version. Bump deliberately.
          image: lscr.io/linuxserver/calibre:latest@sha256:f745d349a6ef81620d6f64dd77123f4d0f20112719b5d99647c67ac4ccb29ffb
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
          volumeMounts:
            - name: library
              mountPath: /config
            - name: books
              mountPath: /books
          resources:
            requests:
              memory: 768Mi
              cpu: 200m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              memory: 1536Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            # 120s of grace before readiness is believed.
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: calibre-library
        - name: books
          persistentVolumeClaim:
            claimName: calibre-library

---

apiVersion: v1
kind: Service
metadata:
  name: calibre
  namespace: books
spec:
  selector:
    app: calibre
  ports:
    - name: web
      port: 8080
      targetPort: 8080
    - name: content
      port: 8081
      targetPort: 8081

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: calibre-tls
  namespace: books
spec:
  secretName: calibre-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - calibre.krugten.org

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre
  namespace: books
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: calibre.krugten.org
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - calibre.krugten.org
      secretName: calibre-tls
  rules:
    - host: calibre.krugten.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: calibre
                port:
                  number: 8080
