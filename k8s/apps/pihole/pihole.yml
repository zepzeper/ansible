---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
        - name: pihole
          image: pihole/pihole:2025.11.1
          env:
            - name: TZ
              value: Europe/Amsterdam
            - name: FTLCONF_webserver_port
              value: "8080"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-admin
                  key: password
            # Pi-hole v6 ignores /etc/dnsmasq.d unless this is on, which makes
            # the dnsmasq hostPath mount below inert by default. The LAN split-
            # horizon overrides are written into that directory.
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
          ports:
            - containerPort: 53
              protocol: TCP
            - containerPort: 53
              protocol: UDP
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: etc
              mountPath: /etc/pihole
            - name: dnsmasq
              mountPath: /etc/dnsmasq.d
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: etc
          hostPath:
            path: /var/lib/pihole/etc
        - name: dnsmasq
          hostPath:
            path: /var/lib/pihole/dnsmasq
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: pihole
  annotations:
    # spec.loadBalancerIP is deprecated since k8s 1.24; this is MetalLB's
    # replacement for pinning the address.
    metallb.io/loadBalancerIPs: 192.168.1.2
spec:
  type: LoadBalancer
  # NOTE: externalTrafficPolicy: Local was tried here to preserve real client
  # IPs (Pi-hole otherwise attributes every query to the cni0 bridge,
  # 10.42.0.1). It broke DNS for the whole LAN - the VIP stopped answering on
  # :53 - so it is reverted to Cluster until the cause is understood.
  selector:
    app: pihole
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: web
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: pihole
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: pihole.krugten.org
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pihole.krugten.org
      secretName: pihole-tls
  rules:
    - host: pihole.krugten.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole
                port:
                  number: 80
