---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
        - name: pihole
          image: pihole/pihole:2025.11.1
          env:
            - name: TZ
              value: Europe/Amsterdam
            - name: FTLCONF_webserver_port
              value: "8080"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-admin
                  key: password
            # Pi-hole v6 ignores /etc/dnsmasq.d unless this is on, which makes
            # the dnsmasq hostPath mount below inert by default. The LAN split-
            # horizon overrides are written into that directory.
            - name: FTLCONF_misc_etc_dnsmasq_d
              value: "true"
            # Pairs with externalTrafficPolicy: Local on the Service below -
            # neither works without the other. The pod's only interface is its
            # 10.42.0.x/24 cni0 address, so the default listeningMode of LOCAL
            # ("answer only hosts on a subnet one of my interfaces is on")
            # treats 10.42.0.0/24 as the entire local network and silently
            # drops everything else. Under externalTrafficPolicy: Cluster that
            # is invisible, because kube-proxy SNATs every query to 10.42.0.1
            # before Pi-hole sees it. Preserve the real source address without
            # setting this and Pi-hole ignores the whole LAN - no refusal, no
            # log line, just DNS gone for the house.
            - name: FTLCONF_dns_listeningMode
              value: "ALL"
          ports:
            - containerPort: 53
              protocol: TCP
            - containerPort: 53
              protocol: UDP
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: etc
              mountPath: /etc/pihole
            - name: dnsmasq
              mountPath: /etc/dnsmasq.d
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
          # Readiness only removes a pod from its Service; it never restarts
          # anything. An FTL that has wedged while still holding :53 open stays
          # Ready forever and keeps taking every DNS query in the house.
          #
          # A real query rather than a TCP connect, because holding the socket
          # open is exactly the failure a connect cannot see. pi.hole is served
          # from Pi-hole's own records, so this stays green during an upstream
          # outage and only trips when FTL itself stops answering - dig exits 0
          # on any reply including NXDOMAIN, and 9 when nothing comes back.
          #
          # Deliberately slack: 30s x 3 means ~90s of silence before a restart,
          # well clear of a slow start or a gravity update.
          livenessProbe:
            exec:
              command:
                - dig
                - +short
                - +tries=1
                - +time=3
                - "@127.0.0.1"
                - pi.hole
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: etc
          hostPath:
            path: /var/lib/pihole/etc
        - name: dnsmasq
          hostPath:
            path: /var/lib/pihole/dnsmasq
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: pihole
  annotations:
    # spec.loadBalancerIP is deprecated since k8s 1.24; this is MetalLB's
    # replacement for pinning the address.
    metallb.io/loadBalancerIPs: 192.168.1.2
spec:
  type: LoadBalancer
  # Without this kube-proxy SNATs every inbound query to the cni0 bridge, so
  # the dashboard attributes all traffic to 10.42.0.1 and per-client stats and
  # per-client blocking are both unusable.
  #
  # This was tried alone once and took DNS down for the whole LAN; the missing
  # half was FTLCONF_dns_listeningMode above, which must be ALL for Pi-hole to
  # answer a source address outside the pod subnet. Do not set one without the
  # other.
  externalTrafficPolicy: Local
  # MetalLB announces 192.168.1.2 by ARP, so it answers only on the LAN. A
  # tailnet client away from home reaches it solely through the
  # 192.168.1.0/24 subnet route, which every client has to accept first -
  # iOS and Android do so automatically, Linux peers need --accept-routes,
  # and a Linux peer physically on this LAN cannot safely turn that on (see
  # roles/tailscale/meta/argument_specs.yml). Serving :53 on the node's
  # Tailscale address as well removes the dependency: it is reachable from
  # anywhere on the tailnet with no route to accept, so it is what the
  # Tailscale global nameserver points at.
  #
  # Same mechanism as the ingress controller - see the externalIPs patch in
  # roles/k8s-base/tasks/main.yml. Hardcoded to match the loadBalancerIPs
  # annotation above; this manifest is applied by kustomize, not templated.
  #
  # Known cost, measured on 2026-08-30: externalTrafficPolicy: Local above does
  # NOT extend to externalIPs on this kube-proxy. Traffic to the LAN VIP keeps
  # its source address, traffic to the Tailscale address is masqueraded to the
  # cni0 bridge. Two queries sent within the same second:
  #
  #   dig @192.168.1.2     -> logged as client 192.168.1.200
  #   dig @100.117.255.24  -> logged as client 10.42.0.1
  #
  # So every device away from home is attributed to 10.42.0.1 in the dashboard,
  # and per-client blocking cannot target one. Filtering itself is unaffected.
  # The alternative - pointing the global nameserver at 192.168.1.2 instead -
  # keeps real client addresses but makes remote DNS depend on each client
  # accepting the subnet route, which Linux peers on this LAN cannot safely do.
  externalIPs:
    - 100.117.255.24
  selector:
    app: pihole
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: web
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: pihole
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: pihole.krugten.org
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pihole.krugten.org
      secretName: pihole-tls
  rules:
    - host: pihole.krugten.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole
                port:
                  number: 80
