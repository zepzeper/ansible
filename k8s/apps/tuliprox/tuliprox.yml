---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuliprox-data
  namespace: tuliprox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tuliprox-backup
  namespace: tuliprox
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuliprox
  namespace: tuliprox
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tuliprox
  template:
    metadata:
      labels:
        app: tuliprox
    spec:
      nodeSelector:
        kubernetes.io/hostname: ds10u
      containers:
        - name: tuliprox
          image: ghcr.io/euzu/tuliprox:3.2.0
          command:
            - /app/tuliprox
          args:
            - -s
            - -p
            - /app/config
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: secrets
              mountPath: /run/secrets/rendered
            - name: data
              mountPath: /app/data
            - name: backup
              mountPath: /app/backup
          resources:
            requests:
              # Idle is ~40Mi RSS. The request covers the resting state; the
              # limit below is what carries the update spike.
              memory: 256Mi
              cpu: 50m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              #
              # Sized from a measured cgroup memory.peak of 1636Mi during a full
              # update: a ~93MB XMLTV EPG parsed with fuzzy smart-matching over
              # the whole Xtream catalogue (live + VOD + series, nothing
              # skipped). config.yml sets update_on_boot, so this spike happens
              # on every start, not just on the 06:00/18:00 schedules - too low
              # a limit means the pod can never reach Ready at all. 2560Mi keeps
              # ~55% headroom for catalogue growth; revisit if the EPG grows.
              memory: 2560Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: config
          hostPath:
            path: /var/lib/tuliprox/config
        - name: secrets
          hostPath:
            path: /run/secrets/rendered
        - name: data
          persistentVolumeClaim:
            claimName: tuliprox-data
        - name: backup
          persistentVolumeClaim:
            claimName: tuliprox-backup
---
apiVersion: v1
kind: Service
metadata:
  name: tuliprox
  namespace: tuliprox
spec:
  selector:
    app: tuliprox
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tuliprox
  namespace: tuliprox
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    external-dns.alpha.kubernetes.io/hostname: iptv.krugten.org
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - iptv.krugten.org
      secretName: tuliprox-tls
  rules:
    - host: iptv.krugten.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tuliprox
                port:
                  number: 8080
