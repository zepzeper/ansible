---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-postgres
  namespace: paperless
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          # Digest is the one this cluster has been running; pinning it here
          # changes nothing today and stops the tag moving underneath a
          # database on the next pod reschedule. postgres:16 tracks every
          # 16.x patch, so a restart could otherwise land on a different
          # minor with different defaults, unannounced.
          image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: paperless
            - name: POSTGRES_USER
              value: paperless
            - name: POSTGRES_PASSWORD
              value: paperless
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 50m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-postgres

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: paperless
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73
          ports:
            - containerPort: 6379

          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: paperless
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: paperless
  labels:
    app: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless
  template:
    metadata:
      labels:
        app: paperless
    spec:
      containers:
        - name: paperless
          # Pinned to the digest running on 2026-08-20. The tag is kept for
          # readability; the digest is what actually resolves, so a reschedule
          # cannot silently change version. Bump deliberately.
          image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:6c86cad803970ea782683a8e80e7403444c5bf3cf70de63b4d3c8e87500db92f
          ports:
            - containerPort: 8000
          env:
            - name: PAPERLESS_REDIS
              value: redis://redis:6379
            - name: PAPERLESS_DBHOST
              value: postgres
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_DBPASS
              value: paperless
            - name: PAPERLESS_URL
              value: https://paperless.krugten.org
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Amsterdam
            - name: PAPERLESS_PORT
              value: "8000"
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: secret-key
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
              subPath: data
            - name: data
              mountPath: /usr/src/paperless/media
              subPath: media
            - name: data
              mountPath: /usr/src/paperless/consume
              subPath: consume
            - name: data
              mountPath: /usr/src/paperless/export
              subPath: export
          resources:
            requests:
              memory: 1Gi
              cpu: 100m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
            # 180s of grace before readiness is believed.
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data

---
apiVersion: v1
kind: Service
metadata:
  name: paperless
  namespace: paperless
spec:
  selector:
    app: paperless
  ports:
    - port: 8000
      targetPort: 8000

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: paperless-tls
  namespace: paperless
spec:
  secretName: paperless-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - paperless.krugten.org

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless
  namespace: paperless
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: paperless.krugten.org
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - paperless.krugten.org
      secretName: paperless-tls
  rules:
    - host: paperless.krugten.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless
                port:
                  number: 8000
