---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.10.1
          ports:
            - containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.krugten.org
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: secrets
              mountPath: /run/secrets/rendered
          resources:
            requests:
              memory: 192Mi
              cpu: 50m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: config
          hostPath:
            path: /var/lib/homepage
        - name: secrets
          hostPath:
            path: /run/secrets/rendered
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
spec:
  selector:
    app: homepage
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - home.krugten.org
      secretName: homepage-tls
  rules:
    - host: home.krugten.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
