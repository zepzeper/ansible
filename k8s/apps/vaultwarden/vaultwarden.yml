---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              # Memory only, deliberately. CPU is compressible - a hungry
              # container gets throttled, it does not kill anything - and a CPU
              # limit causes latency spikes from throttling even on an idle
              # node. Memory is not compressible: without a limit, one runaway
              # container triggers node-level OOM, which kills arbitrary
              # processes - possibly Pi-hole, taking DNS down for the house.
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: data
          hostPath:
            path: /var/lib/vaultwarden
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector:
    app: vaultwarden
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: vaultwarden.krugten.org
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vaultwarden.krugten.org
      secretName: vaultwarden-tls
  rules:
    - host: vaultwarden.krugten.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
