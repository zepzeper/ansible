---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  namespace: mealie
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app: mealie
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          # Pinned to the digest running on 2026-08-20. The tag is kept for
          # readability; the digest is what actually resolves, so a reschedule
          # cannot silently change version. Bump deliberately.
          image: ghcr.io/mealie-recipes/mealie:latest@sha256:f68e959bf66f4f458893ea58facac71690fe6f2ac7a31466b5cecb41b4e99c02
          ports:
            - containerPort: 9000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Amsterdam
            - name: BASE_URL
              value: https://mealie.krugten.org
            - name: DEFAULT_EMAIL
              value: woutervk98@proton.me
            - name: DEFAULT_GROUP
              value: Home
            - name: DEFAULT_HOUSEHOLD
              value: Family
          volumeMounts:
            - name: mealie-data
              mountPath: /app/data
          resources:
            requests:
              # 470Mi observed. The previous 256Mi request understated it, and
              # the 512Mi limit left ~8% headroom - one spike from an OOM kill.
              memory: 512Mi
              cpu: 100m
            limits:
              # Memory only. The cpu: 500m that used to sit here was the only
              # CPU limit in the cluster; throttling causes latency spikes even
              # when the node is idle, and CPU starvation cannot kill a peer.
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
---
apiVersion: v1
kind: Service
metadata:
  name: mealie
  namespace: mealie
spec:
  selector:
    app: mealie
  ports:
    - port: 9000
      targetPort: 9000
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mealie-tls
  namespace: mealie
spec:
  secretName: mealie-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - mealie.krugten.org
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: mealie
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    external-dns.alpha.kubernetes.io/hostname: mealie.krugten.org
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mealie.krugten.org
      secretName: mealie-tls
  rules:
    - host: mealie.krugten.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 9000
