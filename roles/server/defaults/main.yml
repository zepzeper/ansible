---
# Resolver for this host. Empty leaves whatever DHCP provided, so a host on a
# network without Pi-hole is unaffected.
resolver_primary: ""
resolver_fallback: ""

# Extra ports opened in the base ruleset. Empty by default so a plain server
# keeps the minimal set; k3s hosts set these from their own port lists.
firewall_tcp_ports: []
firewall_udp_ports: []

# When true, stop the DHCP client appending the nameservers the router hands
# out, so resolv.conf holds only resolver_primary/resolver_fallback. glibc reads
# at most MAXNS (3) servers, so a router-supplied duplicate wastes a slot.
resolver_exclusive: false
