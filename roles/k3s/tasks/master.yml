---
- name: Install k3s dependencies
  apt:
    name:
      - curl
      - iptables
      - conntrack
    state: present
    update_cache: yes
  tags:
    - deploy
    - k3s

- name: Download k3s install script
  get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  tags:
    - deploy
    - k3s

- name: Install k3s server
  environment:
    INSTALL_K3S_EXEC: "server {{ k3s_extra_flags }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ vault_k3s_token }}"
  shell: |
    /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  tags:
    - deploy
    - k3s

# The task above is a no-op once k3s exists, so a change to k3s_extra_flags would
# otherwise never reach an already-installed server. Re-run the installer when the
# unit's ExecStart no longer matches the flags we want.
- name: Read the installed k3s unit file
  ansible.builtin.slurp:
    src: /etc/systemd/system/k3s.service
  register: k3s_unit
  failed_when: false
  tags:
    - deploy
    - k3s

- name: Reinstall k3s server when flags drifted
  environment:
    INSTALL_K3S_EXEC: "server {{ k3s_extra_flags }}"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ vault_k3s_token }}"
  shell: |
    /usr/local/bin/k3s-install.sh
  when:
    - k3s_unit.content is defined
    - k3s_extra_flags.split()
      | reject('in', k3s_unit.content | b64decode)
      | list | length > 0
  tags:
    - deploy
    - k3s

- name: Wait for k3s to be ready
  command: kubectl get nodes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: k3s_status
  retries: 30
  delay: 5
  until: k3s_status.rc == 0
  changed_when: false
  tags:
    - deploy
    - k3s

- name: Install k3s CLI tools
  apt:
    name: "{{ k3s_packages }}"
    state: present
  when: k3s_packages | length > 0
  tags:
    - deploy
    - k3s

# Firewall rules deliberately live in roles/firewall, which is the sole owner
# of the filter table. This role used to append its ports with the iptables
# module and persist them with iptables-save; roles/server then re-rendered
# the file from its template on the next run and silently closed 6443.
# The ports are declared as firewall_tcp_ports / firewall_udp_ports instead.

- name: Create .kube directory for admin user
  file:
    path: "/home/{{ admin_username }}/.kube"
    state: directory
    owner: "{{ admin_username }}"
    group: "{{ admin_group }}"
    mode: "0755"
  tags:
    - deploy
    - k3s

- name: Copy kubeconfig to admin user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ admin_username }}/.kube/config"
    owner: "{{ admin_username }}"
    group: "{{ admin_group }}"
    mode: "0600"
    remote_src: yes
  become: yes
  tags:
    - deploy
    - k3s
