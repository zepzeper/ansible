---
- name: Install k3s dependencies
  apt:
    name:
      - curl
      - iptables
      - conntrack
    state: present
    update_cache: yes
  tags:
    - deploy
    - k3s

- name: Download k3s install script
  get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  tags:
    - deploy
    - k3s

- name: Install k3s agent
  environment:
    INSTALL_K3S_EXEC: "agent"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ hostvars[groups['k3s_master'][0]]['ansible_host'] }}:6443"
    K3S_TOKEN: "{{ vault_k3s_token }}"
  shell: |
    /usr/local/bin/k3s-install.sh
  args:
    creates: /usr/local/bin/k3s
  tags:
    - deploy
    - k3s

# Firewall rules live in roles/firewall, the sole owner of the filter table.
# Worker ports are declared as firewall_tcp_ports / firewall_udp_ports.
