---
- name: restore iptables
  shell: |
    iptables-restore < /etc/iptables/rules.v4
    ip6tables-restore < /etc/iptables/rules.v6
    # iptables-restore replaces the whole filter table, which deletes the
    # ts-input/ts-forward chains tailscaled installs. The node then silently
    # drops everything arriving over the tailnet while still answering on the
    # LAN - it looks like the host is half dead. Restarting tailscaled puts
    # them back.
    if systemctl is-active --quiet tailscaled; then
      systemctl restart tailscaled
    fi
