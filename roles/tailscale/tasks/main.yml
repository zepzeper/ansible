---
- name: Install Tailscale dependencies
  apt:
    name:
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: yes
  tags:
    - configure
    - network
    - tailscale

- name: Remove old Tailscale source list and keyring (if present)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/tailscale.list
    - /usr/share/keyrings/tailscale-archive-keyring.gpg
  tags:
    - configure
    - network
    - tailscale

- name: Add Tailscale apt repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types: deb
    uris: https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: https://pkgs.tailscale.com/stable/{{ ansible_facts['distribution'] | lower }}/{{ ansible_facts['distribution_release'] | lower }}.noarmor.gpg
    state: present
  tags:
    - configure
    - network
    - tailscale

- name: Install Tailscale package
  apt:
    name: tailscale
    state: present
  tags:
    - configure
    - network
    - tailscale

- name: Enable tailscaled service
  systemd:
    name: tailscaled
    enabled: yes
    state: started
  tags:
    - configure
    - network
    - tailscale

- name: Check if Tailscale is already authenticated
  command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  # Read-only, and the task below cannot evaluate its condition without the
  # result. Skipping it under --check made a dry run fail outright.
  check_mode: false
  tags:
    - configure
    - network
    - tailscale

- name: Authenticate Tailscale
  shell: |
    tailscale up \
      --authkey="{{ vault_tailscale_authkey }}" \
      --advertise-routes="{{ k3s_advertise_routes }}" \
      --accept-routes={{ tailscale_accept_routes | default('false') }}
  # Guard on stdout being parseable before reaching for from_json: a failed or
  # skipped probe leaves it empty, and from_json on '' raises rather than
  # returning a default.
  when: >
    tailscale_status.rc != 0 or
    (tailscale_status.stdout | default('') | trim | length) == 0 or
    (tailscale_status.stdout | from_json).get('BackendState') != 'Running'
  notify: restart tailscaled
  # The pre-auth key is on the command line, so without this it is echoed in
  # task output on failure and under -v.
  no_log: true
  # Only runs on a node that is not already Running on the tailnet, so getting
  # here means the node is being joined.
  changed_when: true
  tags:
    - configure
    - network
    - tailscale

# `tailscale up` above only runs on a node that is not yet authenticated, so a
# change to the advertised routes or the exit-node flag would never reach a
# machine that is already on the tailnet. `tailscale set` applies them to a
# running node without re-authenticating, and is idempotent.
- name: Reconcile advertised routes and exit node
  command: >
    tailscale set
    --advertise-routes={{ k3s_advertise_routes }}
    --advertise-exit-node={{ tailscale_advertise_exit_node | default(true) | bool | lower }}
  register: tailscale_set
  changed_when: false
  tags:
    - configure
    - network
    - tailscale
