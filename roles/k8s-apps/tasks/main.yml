---
# Host-side configuration first: several deployments mount these paths as
# hostPath, so the files have to exist before the pods that read them start.
# This is the part Flux could never own - it is the machine, not the cluster.

- name: Create Home Assistant configuration
  template:
    src: configuration.yaml.j2
    dest: /var/lib/home-assistant/configuration.yaml
    mode: "0644"
  tags:
    - deploy
    - home-assistant

- name: Create Home Assistant themes directory
  file:
    path: /var/lib/home-assistant/themes
    state: directory
    mode: "0755"
  tags:
    - deploy
    - home-assistant

- name: Create Home Assistant placeholder files
  copy:
    content: ""
    dest: "{{ item }}"
    force: no
    mode: "0644"
  loop:
    - /var/lib/home-assistant/automations.yaml
    - /var/lib/home-assistant/scripts.yaml
    - /var/lib/home-assistant/scenes.yaml
    - /var/lib/home-assistant/themes/.gitkeep
  tags:
    - deploy
    - home-assistant

# services.yaml carries eight credentials - the Pi-hole password, six service
# API tokens and the qBittorrent login - so this loop needs the same treatment
# as the TuliProx one below, in both directions.
#
# no_log, because `make check` runs --check --diff and a template diff prints
# the rendered file in full: a dry run was enough to spill all eight to the
# terminal and into any CI log that captured it.
#
# 0640 rather than 0644, because no_log only protects them in transit. The file
# was world-readable on the host and could be read without sudo. The container
# runs as root, so dropping the world bit costs nothing.
- name: Create Homepage config files
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - {src: homepage-settings.yaml.j2, dest: /var/lib/homepage/settings.yaml}
    - {src: homepage-services.yaml.j2, dest: /var/lib/homepage/services.yaml}
    - {src: homepage-bookmarks.yaml.j2, dest: /var/lib/homepage/bookmarks.yaml}
    - {src: homepage-widgets.yaml.j2, dest: /var/lib/homepage/widgets.yaml}
    - {src: homepage-kubernetes.yaml.j2, dest: /var/lib/homepage/kubernetes.yaml}
  no_log: true
  tags:
    - deploy
    - homepage

# source.yml holds the IPTV provider credentials and api-proxy.yml the local
# proxy login. no_log already kept them out of task output; 0640 keeps them off
# a world-readable path on disk. The container runs as root.
- name: Create TuliProx config files
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - {src: tuliprox-source.yml.j2, dest: /var/lib/tuliprox/config/source.yml}
    - {src: tuliprox-config.yml.j2, dest: /var/lib/tuliprox/config/config.yml}
    - {src: tuliprox-api-proxy.yml.j2, dest: /var/lib/tuliprox/config/api-proxy.yml}
  no_log: true
  tags:
    - deploy
    - tuliprox

###############################################################################
# Applications
###############################################################################

- name: Apply application manifests
  kubernetes.core.k8s:
    definition: "{{ lookup('kubernetes.core.kustomize', dir=k8s_tree + '/apps') }}"
    apply: true
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
  tags:
    - deploy
    - apps
    - manifests

###############################################################################
# Forgejo Actions runner
#
# The runner's init container registers against Forgejo using a token in the
# forgejo-runner-registration Secret. The token is minted by the Forgejo CLI
# inside the server pod, so nothing lands in git - but it can only be minted
# once Forgejo is running, which is why this sits after the apply above.
###############################################################################

- name: Read the Actions runner registration token secret
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: forgejo
    name: forgejo-runner-registration
  register: runner_token_secret
  tags:
    - deploy
    - actions

# Only minted once: regenerating on every run would change the Secret, restart
# the runner pod, and leave a stale registration in Forgejo's admin panel.
- name: Mint an Actions runner registration token
  when: runner_token_secret.resources | length == 0
  block:
    - name: Find the running Forgejo pod
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: forgejo
        label_selectors:
          - app=forgejo
        field_selectors:
          - status.phase=Running
      register: forgejo_pods
      tags:
        - deploy
        - actions

    - name: Generate the runner registration token
      kubernetes.core.k8s_exec:
        namespace: forgejo
        pod: "{{ forgejo_pods.resources[0].metadata.name }}"
        command: su git -c "forgejo actions generate-runner-token"
      register: runner_token_exec
      no_log: true
      tags:
        - deploy
        - actions

    - name: Store the runner registration token as a Secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: forgejo-runner-registration
            namespace: forgejo
          stringData:
            token: "{{ runner_token_exec.stdout | trim }}"
      no_log: true
      tags:
        - deploy
        - actions

###############################################################################
# Forgejo branch protection
###############################################################################
# After the runner, because both talk to a Forgejo that has to be up, and
# skipped entirely when no rules are declared - so a cluster that has not
# decided which branches to protect does not mint an API token for nothing.

- name: Configure Forgejo branch protection
  # `apply` is not optional here. Tags on a dynamic include attach to the
  # include statement, not to what it pulls in - so `--tags forgejo` matches
  # this task, runs it, and then filters out every task inside the file. The
  # play reports ok and changes nothing, which is the worst way to be wrong.
  ansible.builtin.include_tasks:
    file: forgejo-branch-protection.yml
    apply:
      tags:
        - deploy
        - forgejo
  when: forgejo_branch_protection | length > 0
  tags:
    - deploy
    - forgejo

- name: Wait for application deployments to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ item.namespace }}"
    name: "{{ item.deploy }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 120
  loop: "{{ k8s_app_deployments }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.deploy }}"
  # A single slow or crash-looping app should not mask the rest of the report.
  register: app_health
  failed_when: false
  tags:
    - deploy
    - health

- name: Report application deployments that are not ready
  debug:
    msg: >-
      Not ready: {{ app_health.results
                    | selectattr('failed', 'defined')
                    | selectattr('failed')
                    | map(attribute='item')
                    | map('to_json') | join(', ') }}
  when: app_health.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
  tags:
    - deploy
    - health

###############################################################################
# LAN split-horizon DNS
###############################################################################

# Read the hostnames back out of the cluster rather than keeping a second list
# in sync by hand, so a newly added Ingress is picked up on the next run.
- name: Collect Ingress hostnames
  kubernetes.core.k8s_info:
    kind: Ingress
    api_version: networking.k8s.io/v1
  register: ingress_objects
  tags:
    - deploy
    - dns

- name: Write Pi-hole LAN overrides
  template:
    src: pihole-lan-dns.conf.j2
    dest: /var/lib/pihole/dnsmasq/02-lan-split-horizon.conf
    mode: "0644"
  notify: restart pihole
  tags:
    - deploy
    - dns
