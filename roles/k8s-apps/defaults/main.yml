---
# Where k3s writes its kubeconfig. These roles run as root, whose ~/.kube/config
# does not exist.
k8s_kubeconfig: /etc/rancher/k3s/k3s.yaml

k8s_tree: "{{ playbook_dir }}/../k8s"

# Checked for readiness after apply. Kept explicit rather than derived, because
# a deployment that never appears is exactly the failure worth reporting.
k8s_app_deployments:
  - {namespace: pihole, deploy: pihole}
  - {namespace: home-assistant, deploy: home-assistant}
  - {namespace: vaultwarden, deploy: vaultwarden}
  - {namespace: mealie, deploy: mealie}
  # The Deployment is named kuma, not uptimekuma - only the directory and the
  # manifest file carry the product name. This entry said uptimekuma, so the
  # readiness gate waited 120s for an object that does not exist and reported
  # Kuma not ready on every single apps deploy.
  - {namespace: kuma, deploy: kuma}
  - {namespace: homepage, deploy: homepage}
  - {namespace: tuliprox, deploy: tuliprox}
  - {namespace: books, deploy: calibre}
  - {namespace: media, deploy: qbittorrent}
  - {namespace: media, deploy: prowlarr}
  - {namespace: media, deploy: readarr}
  - {namespace: paperless, deploy: paperless}
  - {namespace: paperless, deploy: redis}
  - {namespace: paperless, deploy: postgres}
  - {namespace: forgejo, deploy: forgejo}
  - {namespace: forgejo, deploy: forgejo-runner}

###############################################################################
# Forgejo branch protection
###############################################################################
# Applied through the API after the apps are up, because it is per repository
# and app.ini cannot express it. Without a rule here, the merge style set in
# k8s/apps/forgejo/forgejo.yml is advisory: nothing stops a direct push to the
# branch a pull request was going to land on.
#
# Empty by default. Each entry is {repo: "owner/name", rule: "<branch or
# glob>"} plus any override from forgejo_branch_protection_defaults below.
forgejo_branch_protection: []

forgejo_api_url: https://forgejo.krugten.org

# Remove protection rules that exist on a declared repository but are no longer
# listed above, so dropping a line here actually drops the rule.
#
# Scoped to repositories that appear in forgejo_branch_protection and no
# others. Turn it off if you keep rules that are managed by hand on those same
# repositories - the play will then name them on each run rather than remove
# them.
forgejo_branch_protection_prune: true

# The user the API token is minted for. Needs admin on the repositories the
# rules cover.
forgejo_admin_user: zepzeper

forgejo_branch_protection_defaults:
  # The whole point: the branch cannot be pushed to directly, so a change
  # reaches it through a pull request or not at all.
  enable_push: false

  # Zero, and this is not laziness on a one-person forge - it is the only
  # value that works. Forgejo will not let you approve your own pull request,
  # so `required_approvals: 1` on an instance with one human means nothing can
  # ever merge, and the error at the bottom of the PR page does not say why.
  # Raise it the day there is somebody else to do the approving.
  required_approvals: 0

  # The branch has to be current with its target before it can merge. This is
  # what makes the rebase merge style honest: without it, a pull request can be
  # merged having been tested against a base from last week.
  block_on_outdated_branch: true

  # A rejected review blocks the merge until it is resolved.
  block_on_rejected_reviews: true

  # Off, deliberately. With apply_to_admins on, a rule that turns out to be
  # wrong locks out the only account that could fix it - and on this instance
  # that is the same person who would be trying to. The rule exists to stop an
  # accidental push, not to bind you; turn it on when there is somebody else
  # with admin.
  apply_to_admins: false

  # Requires named CI checks to pass. Off by default because the context names
  # have to match exactly what Forgejo Actions reports, and a context that
  # never reports blocks every merge on that branch forever with no indication
  # that the name is the problem. Set status_check_contexts and turn this on
  # only after seeing the names on a real pull request.
  enable_status_check: false
  status_check_contexts: []

  require_signed_commits: false
  dismiss_stale_approvals: false
