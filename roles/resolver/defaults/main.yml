---
# Empty leaves whatever DHCP provided, so a host on a network without Pi-hole is
# unaffected and the whole role skips.
resolver_primary: ""
resolver_fallback: ""

# When true, stop the DHCP client appending the nameservers the router hands
# out, so resolv.conf holds only resolver_primary/resolver_fallback. glibc reads
# at most MAXNS (3) servers, so a router-supplied duplicate wastes a slot.
resolver_exclusive: false

# Interfaces dhcpcd must not manage.
#
# tailscale0 was here first, because a dhcpcd rebind strips its address and the
# node falls off the tailnet. The container interfaces are the same class of
# problem discovered the hard way: every pod start and stop creates or destroys
# a veth, dhcpcd treats each one as an interface event, and regenerating its
# state rewrites /etc/resolv.conf. There is a window in that rewrite with no
# usable nameserver.
#
# It is not rare. ds10u logged 321 dhcpcd veth events in two hours, and one of
# them landed underneath an Ansible get_url, which failed all three retries with
# "Temporary failure in name resolution" while both configured resolvers were
# answering perfectly when queried directly. Anything on the node that resolves
# a name - image pulls included - can lose the same coin flip.
resolver_deny_interfaces: "tailscale0 veth* cni* flannel* kube-bridge* docker*"

# Stop dhcpcd accepting the nameservers the router advertises over IPv6.
#
# resolver_exclusive only suppresses the DHCPv4 domain_name_servers option, so
# it looked complete while a third resolver kept appearing anyway. ds10u's
# resolv.conf carried the router's ULA address:
#
#   # Generated by dhcpcd from enp1s0.dhcp, enp1s0.ra
#   nameserver 192.168.1.2
#   nameserver 1.1.1.1
#   nameserver fd36:7e6:76f0::1     <- from the RA, not from DHCP
#
# It arrives through RDNSS in a Router Advertisement, which dhcpcd's
# 20-resolv.conf hook merges straight into new_domain_name_servers. No DHCP
# option is involved, so `nooption` cannot reach it - dhcpcd's only documented
# knob is refusing RAs outright.
#
# The cost of that: dhcpcd stops configuring SLAAC on the LAN interface, so the
# host loses its ULA address. On ds10u that address carries no default route
# (`ip -6 route show default` is empty), so nothing routable goes with it - but
# check that before enabling this on a host with real IPv6 connectivity.
#
# Left false by default because the failure it prevents is quiet: glibc only
# reaches the third nameserver when the first two time out, and an unfiltered
# resolver answering then is exactly when it is least likely to be noticed.
resolver_deny_ra_dns: false
