---
# Ansible applies the Kustomize tree in k8s/ with kubernetes.core.k8s rather than
# shelling out to kubectl. The module compares desired against live state, so it
# reports change honestly instead of relying on grep guards, and server-side
# apply resolves field ownership rather than clobbering.
#
# Ordering is explicit because three upstream components install their own CRDs
# that later resources depend on. That is the one thing a task sequence still has
# to get right by hand.

# kubernetes.core.k8s executes on the target and needs the client library there.
# The old kubectl shell-outs did not, so this is a new prerequisite - and without
# it every task in this role fails on the first run.
- name: Install the Kubernetes client library
  apt:
    name:
      - python3-kubernetes
      - python3-yaml
    state: present
  tags:
    - deploy
    - cluster

- name: Fix kubeconfig permissions
  file:
    path: /etc/rancher/k3s/k3s.yaml
    mode: "0644"
  tags:
    - deploy
    - cluster

- name: Copy kubeconfig to admin user
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ admin_username }}/.kube/config"
    owner: "{{ admin_username }}"
    group: "{{ admin_group }}"
    mode: "0600"
    remote_src: yes
  tags:
    - deploy
    - cluster

- name: Create data directories for hostPath volumes
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /var/lib/pihole/etc
    - /var/lib/pihole/dnsmasq
    - /var/lib/home-assistant
    - /var/lib/home-assistant/custom_components
    - /var/lib/vaultwarden
    - /var/lib/homepage
    - /var/lib/tuliprox/config
    - /run/secrets/rendered
  tags:
    - deploy
    - cluster

# The runner image runs as uid 1000 and needs write access to its registration
# file and cache, so these two dirs get explicit ownership - the loop above
# deliberately stays a flat list of root-owned dirs.
- name: Create the Actions runner data directories
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - {path: /var/lib/forgejo-runner, owner: "1000", group: "1000"}
    - {path: /var/lib/forgejo-runner-docker, owner: root, group: root}
  tags:
    - deploy
    - cluster

# Namespaces first: the upstream installs below and the secrets after them all
# land in namespaces this creates.
- name: Apply namespaces
  kubernetes.core.k8s:
    definition: "{{ lookup('kubernetes.core.kustomize', dir=k8s_tree + '/infrastructure/namespaces') }}"
    apply: true
    state: present
  tags:
    - deploy
    - cluster
    - namespaces

###############################################################################
# Upstream components
#
# Fetched to disk and applied with the module rather than `kubectl apply -f URL`,
# so a failed download is distinguishable from a failed apply and the result is
# reported as a real change.
###############################################################################

- name: Ensure the upstream manifest cache exists
  file:
    path: /opt/k8s-upstream
    state: directory
    mode: "0755"
  # Runs under --check too. Creating an empty directory changes nothing
  # observable, and without it every later task in this role is unverifiable in
  # a dry run - the fetch has nowhere to write and the applies never execute.
  check_mode: false
  tags:
    - deploy
    - cluster

# force is what makes the pins above mean anything. get_url defaults to
# force: no, which skips the download whenever the destination already exists -
# so editing a pinned URL left the previous release sitting in the cache and the
# apply below kept installing it. Changing the cert-manager pin from v1.14.4 to
# v1.21.1 was a no-op for exactly this reason, silently, with a green recap.
#
# ingress-nginx happened to update anyway because raw.githubusercontent.com
# sends Last-Modified and Ansible will re-fetch on that; the GitHub release
# asset cert-manager is served from does not, which is why one moved and the
# other did not. Relying on that difference is not a pinning strategy.
#
# Re-downloading every run is cheap and still reports change honestly: the
# module compares content and only says changed when the file actually differs.
- name: Fetch upstream component manifests
  get_url:
    url: "{{ item.url }}"
    dest: "/opt/k8s-upstream/{{ item.name }}.yaml"
    force: true
    mode: "0644"
  loop: "{{ k8s_upstream_components }}"
  loop_control:
    label: "{{ item.name }}"
  register: upstream_fetch
  retries: 3
  delay: 5
  until: upstream_fetch is succeeded
  # Also runs under --check. Downloading pinned upstream YAML into a cache
  # changes nothing about the running system, and it is what lets the applies
  # below produce a real diff in a dry run instead of failing on a missing file.
  check_mode: false
  tags:
    - deploy
    - cluster

- name: Apply cert-manager
  kubernetes.core.k8s:
    src: /opt/k8s-upstream/cert-manager.yaml
    apply: true
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
  tags:
    - deploy
    - certs

- name: Wait for cert-manager to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: cert-manager
    name: "{{ item }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 180
  loop:
    - cert-manager
    - cert-manager-webhook
  tags:
    - deploy
    - certs

# MetalLB before ingress-nginx, which is a LoadBalancer service: with no address
# pool present it sits <pending> indefinitely and never reports a status address.
- name: Apply MetalLB
  kubernetes.core.k8s:
    src: /opt/k8s-upstream/metallb.yaml
    apply: true
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
  tags:
    - deploy
    - loadbalancer

- name: Wait for MetalLB to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: metallb-system
    name: controller
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 180
  tags:
    - deploy
    - loadbalancer

# The upstream manifest ships two one-shot Jobs that mint the admission
# webhook's certificate. Job.spec.template is immutable, so applying a manifest
# whose Jobs carry a newer certgen image is rejected outright - "field is
# immutable" - and the apply fails before the controller is touched at all.
# That is not an edge case, it is what every version bump does, and a bump that
# always fails is a bump nobody repeats: this cluster sat on controller-v1.9.4
# from June until 2026-08-23 with IngressNightmare unpatched.
#
# Deleting them is safe. Both Jobs ran to completion months ago, and the Secret
# they produced (ingress-nginx-admission) is a separate object that outlives
# them - the apply below recreates the Jobs and they reissue the certificate.
#
# Guarded on a real version change so an ordinary converge stays a no-op rather
# than deleting and recreating two Jobs on every run.
- name: Read the running ingress-nginx controller
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: ingress-nginx
    name: ingress-nginx-controller
  register: ingress_running
  tags:
    - deploy
    - ingress

- name: Clear the completed admission jobs when the pinned version changed
  kubernetes.core.k8s:
    state: absent
    kind: Job
    namespace: ingress-nginx
    name: "{{ item }}"
  loop:
    - ingress-nginx-admission-create
    - ingress-nginx-admission-patch
  when:
    - ingress_running.resources | length > 0
    - ingress_nginx_version not in
      ingress_running.resources[0].spec.template.spec.containers[0].image
  tags:
    - deploy
    - ingress

# --publish-service and --publish-status-address are mutually exclusive - the
# controller exits at startup if both are set - so this swaps one for the other
# in the manifest before it is applied, rather than applying upstream's choice
# and then patching it back afterwards.
#
# The patch-afterwards version rolled the controller on every single k8s-base
# run: the apply reset args to upstream's, the patch set them back, and the
# Deployment changed twice per converge. That was not just noise. Each roll
# briefly emptied every Ingress .status, external-dns read that as "no records
# wanted" and deleted the whole zone, and public resolvers cached the resulting
# NODATA for 1800s. external-dns is now upsert-only so it cannot delete, but the
# roll itself should not have been happening either.
#
# Rendering into a separate file keeps the fetched copy pristine, so get_url
# stays idempotent and this task reports change only when the rendered output
# actually differs.
- name: Render the ingress-nginx manifest with our status-publishing flag
  # cmd: rather than free-form, because the shell module parses a free-form
  # string for key=value module arguments and a line like `src=...` is read as
  # one, failing the play before the script ever runs.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      upstream=/opt/k8s-upstream/ingress-nginx.yaml
      rendered=/opt/k8s-upstream/ingress-nginx.rendered.yaml
      tmp=$(mktemp)
      sed -E 's|^([[:space:]]+)- --publish-service=.*$|\1- --publish-status-address={{ ingress_status_address }}|' \
        "$upstream" > "$tmp"
      # Fail loudly rather than silently shipping upstream's flag if the arg is
      # ever renamed or reformatted upstream.
      grep -qF -- '--publish-status-address={{ ingress_status_address }}' "$tmp"
      if cmp -s "$tmp" "$rendered"; then
        rm -f "$tmp"; echo UNCHANGED
      else
        mv "$tmp" "$rendered"; chmod 0644 "$rendered"; echo RENDERED
      fi
  register: ing_render
  changed_when: "'RENDERED' in ing_render.stdout"
  tags:
    - deploy
    - ingress

- name: Apply nginx-ingress
  kubernetes.core.k8s:
    src: /opt/k8s-upstream/ingress-nginx.rendered.yaml
    apply: true
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
  tags:
    - deploy
    - ingress

###############################################################################
# Secrets
###############################################################################

- name: Create Cloudflare API token secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: cloudflare-api-token
        namespace: "{{ item }}"
      stringData:
        api-token: "{{ vault_cloudflare_api_token }}"
  loop: "{{ k8s_cloudflare_secret_namespaces }}"
  # Without this the token is printed in task output on failure and under -v.
  no_log: true
  tags:
    - deploy
    - secrets

- name: Create the Pi-hole admin secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pihole-admin
        namespace: pihole
      stringData:
        password: "{{ vault_pihole_password }}"
  # Was the literal string changeme, committed in git, on a service reachable
  # from the LAN and over the tailnet.
  no_log: true
  tags:
    - deploy
    - secrets

- name: Create the paperless secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: paperless-secret
        namespace: paperless
      stringData:
        secret-key: "{{ vault_paperless_secret_key }}"
  # Django's SECRET_KEY. Was the literal changeme-in-vault; it signs sessions
  # and password-reset tokens, so a known value means forgeable ones.
  no_log: true
  tags:
    - deploy
    - secrets

###############################################################################
# Cluster infrastructure from the Kustomize tree
#
# Applied after the upstream components because ClusterIssuer needs cert-manager
# CRDs and IPAddressPool needs MetalLB's, both of which arrive above.
###############################################################################

- name: Apply cluster infrastructure
  kubernetes.core.k8s:
    definition: "{{ lookup('kubernetes.core.kustomize', dir=k8s_tree + '/infrastructure') }}"
    apply: true
    state: present
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
  # The MetalLB validating webhook can refuse connections for a few seconds after
  # its controller reports Available.
  register: infra_apply
  retries: 6
  delay: 10
  until: infra_apply is succeeded
  tags:
    - deploy
    - cluster

###############################################################################
# ingress-nginx patches
#
# These modify objects the upstream manifest owns, so they run after it is
# applied rather than being Kustomize patches over a remote base - a remote base
# would make `kustomize build` require network access, including in CI.
###############################################################################

- name: Pin the ingress-nginx VIP and also serve it on the Tailscale address
  kubernetes.core.k8s:
    state: patched
    kind: Service
    name: ingress-nginx-controller
    namespace: ingress-nginx
    definition:
      metadata:
        annotations:
          metallb.io/loadBalancerIPs: "{{ ingress_lan_address }}"
      spec:
        # The MetalLB VIP is announced by ARP and answers only on the LAN, so
        # kube-proxy has to be told to accept traffic for the Tailscale address
        # too - otherwise a tailnet client addressing the node by its Tailscale
        # IP hits a closed port. Deliberately not ingress_status_address: DNS
        # publishes the LAN VIP (see that var), while this keeps the tailnet
        # address served for anyone who targets it directly.
        externalIPs:
          - "{{ ingress_tailscale_address }}"
  tags:
    - deploy
    - ingress

- name: Wait for nginx-ingress controller to roll out
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: ingress-nginx
    name: ingress-nginx-controller
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 180
  tags:
    - deploy
    - ingress
