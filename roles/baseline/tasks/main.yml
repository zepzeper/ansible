---
- name: Set hostname
  hostname:
    name: "{{ server_hostname }}"
  when: manage_hostname | bool
  tags:
    - bootstrap

- name: Update /etc/hosts
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ server_hostname }}"
    state: present
  when: manage_hostname | bool
  tags:
    - bootstrap

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  tags:
    - bootstrap

- name: Install base packages
  apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - bootstrap

- name: Generate en_US.UTF-8 locale
  community.general.locale_gen:
    name: "{{ locale }}"
    state: present
  tags:
    - bootstrap

- name: Generate extra locales
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ extra_locales }}"
  tags:
    - bootstrap

- name: Set default locale
  command: localectl set-locale LANG={{ locale }}
  changed_when: false
  tags:
    - bootstrap

- name: Create admin group
  group:
    name: "{{ admin_group }}"
    state: present
  tags:
    - bootstrap
    - identity

- name: Create admin user
  user:
    name: "{{ admin_username }}"
    group: "{{ admin_group }}"
    groups: sudo
    append: yes
    shell: "{{ admin_shell }}"
    createhome: yes
    state: present
  tags:
    - bootstrap
    - identity

- name: Set authorized keys for admin user
  ansible.posix.authorized_key:
    user: "{{ admin_username }}"
    key: "{{ item }}"
    state: present
  loop: "{{ admin_ssh_keys }}"
  tags:
    - bootstrap
    - identity

- name: Configure sudo for admin group without password
  copy:
    content: "%{{ admin_group }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ admin_group }}"
    mode: "0440"
    validate: "visudo -cf %s"
  tags:
    - bootstrap
    - identity

- name: Disable root SSH login
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  notify: restart sshd
  tags:
    - configure
    - ssh

###############################################################################
# Stale provisioning artefacts
###############################################################################

# The preseed's late_command used to grant `admin` passwordless sudo
# unconditionally. On ds10u that grant outlived the account: the file is present
# while `getent passwd admin` returns nothing, so anyone who later creates a user
# by that name inherits root. The preseed no longer writes it; this removes the
# one already on disk.
#
# Guarded twice so it can never remove a grant that is actually in use.
- name: Check whether the legacy admin account exists
  getent:
    database: passwd
    key: admin
    fail_key: false
  register: legacy_admin
  tags:
    - bootstrap
    - identity

- name: Remove the sudo grant left behind for a non-existent admin account
  file:
    path: /etc/sudoers.d/admin
    state: absent
  when:
    - admin_username != 'admin'
    - not (legacy_admin.ansible_facts.getent_passwd.admin is defined
           and legacy_admin.ansible_facts.getent_passwd.admin)
  tags:
    - bootstrap
    - identity

# Left by the old k8s role, which rsynced the manifest tree to
# /home/{{ admin_username }} before applying it. admin_username has not always
# resolved the same way, so copies accumulated under two different homes. The
# Kustomize lookup renders on the control node, so nothing is copied to the host
# at all now.
- name: Remove stale manifest copies from home directories
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/admin/kubernetes-manifests
    - "/home/{{ admin_username }}/kubernetes-manifests"
  tags:
    - bootstrap
    - identity
