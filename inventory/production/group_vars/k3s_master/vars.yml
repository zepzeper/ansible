---
# K3s master configuration
k3s_role: "server"
# servicelb (klipper) MUST stay disabled: MetalLB owns LoadBalancer services.
# With both active, klipper claims every LB service first and writes node IPs
# into .status, which is what external-dns then publishes.
k3s_extra_flags: "--disable traefik --disable servicelb --write-kubeconfig-mode 644"
k3s_advertise_routes: "192.168.1.0/24"

# Firewall ports for k3s master
k3s_master_tcp_ports:
  - 6443
  - 10250
  - 10251
  - 10252
  - 53

k3s_master_udp_ports:
  - 8472
  - 53

# K3s packages (kubectl installed by k3s, helm/k9s optional)
k3s_packages: []

# Address published into every Ingress .status by the nginx controller, and
# therefore the address external-dns writes to Cloudflare. This is the master's
# Tailscale IP on purpose: it resolves to the same host on and off the LAN, so
# clients never depend on the advertised 192.168.1.0/24 subnet route (which a
# device physically on that LAN will always ignore in favour of its own
# interface route).
ingress_status_address: "100.117.255.24"

# The ingress-nginx MetalLB VIP, pinned so the Pi-hole split-horizon overrides
# point at a stable address. Must sit inside the MetalLB pool in
# kubernetes-manifests/metallb/ippool.yml.
ingress_lan_address: "192.168.1.3"

# Advertising ds10u as an exit node is what gives ad-blocking away from home.
# Tailscale's custom global nameserver is gated on the free plan, so tailnet
# clients cannot simply be pointed at Pi-hole; routing a device's traffic
# through this node instead sends its DNS to Pi-hole along with everything else.
# Exit nodes and subnet routers are both free-tier features.
tailscale_advertise_exit_node: true

# Pi-hole primary. Exit-node clients inherit this resolver, so it is what blocks
# ads on a device that is away from home.
#
# The fallback must be a resolver that actually answers. 192.168.1.254 was tried
# first and does not run DNS at all - it only relays DHCP - so the fallback was
# dead weight. That turned a Pi-hole restart into a deadlock: Pi-hole is a pod on
# this host, so while it is down the node cannot resolve the registry to pull the
# very image it needs to come back. A public resolver breaks that loop. It is
# only consulted when Pi-hole fails to answer, so ad filtering is unaffected in
# normal operation.
resolver_primary: "192.168.1.2"
resolver_fallback: "1.1.1.1"

# Fold the k3s ports into the base ruleset rendered by roles/server, so a
# standalone `make bootstrap` produces a complete firewall instead of one that
# is only correct until the next `make k3s`.
firewall_tcp_ports: "{{ k3s_master_tcp_ports }}"
firewall_udp_ports: "{{ k3s_master_udp_ports }}"
resolver_exclusive: true
